name: Gerar vídeo do YouTube

# Gera video.mp4 (1920x1080), legendas.srt, miniatura.png e creditos.txt a partir de
# conteudo-social/<slug>/youtube.md, video.json e imagens.json, e anexa como artefato
# da execução (baixe em Actions > execução > Artifacts).
# Roda sozinho quando imagens.json (fotos revisadas) ou o gerador mudam, ou manualmente.
# Um video.json novo só dispara a busca de fotos (buscar-imagens.yml); o vídeo sai depois da revisão.
# Depois de gerar, envia ao YouTube como privado (segredos YOUTUBE_*), uma vez por vídeo.
# Voz: com o segredo AZURE_SPEECH_KEY e a variável AZURE_SPEECH_REGION, usa o Azure
# (voz na variável VOZ_AZURE, tom em VOZ_AZURE_TOM). Sem eles, a voz neural grátis da
# Microsoft (edge-tts, pt-BR-AntonioNeural).
# Para voltar à voz clonada da ElevenLabs (segredo ELEVENLABS_API_KEY + variável
# ELEVENLABS_VOICE_ID), crie a variável do repositório VOZ=elevenlabs.
# Outra voz grátis: variável VOZ_GRATIS (ex.: pt-BR-FranciscaNeural).
on:
  push:
    paths:
      - 'conteudo-social/*/imagens.json'
      - 'scripts/gerar-video.mjs'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug do artigo (ex.: confiar-em-deus-nos-tempos-dificeis)'
        required: true
        type: string
      voz:
        description: 'Voz da narração'
        required: false
        default: 'azure'
        type: choice
        options: [azure, gratis, elevenlabs]

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar ffmpeg e espeak-ng
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng fonts-dejavu
      - run: npm ci
      - name: Instalar a voz grátis (edge-tts)
        run: pip install -q edge-tts
      - name: Cache das fotos baixadas
        uses: actions/cache@v4
        with:
          path: .cache-video/*/fotos
          key: fotos-${{ hashFiles('conteudo-social/*/imagens.json') }}
          restore-keys: fotos-
      - name: Cache das narrações (não gasta créditos da ElevenLabs de novo)
        id: cache-narracao
        uses: actions/cache/restore@v4
        with:
          path: .cache-video/*/*.mp3
          key: narracao-${{ vars.ELEVENLABS_VOICE_ID }}-${{ hashFiles('conteudo-social/*/youtube.md') }}
          restore-keys: narracao-${{ vars.ELEVENLABS_VOICE_ID }}-
      - name: Quais vídeos gerar
        id: quais
        env:
          SLUG: ${{ inputs.slug }}
          ANTES: ${{ github.event.before }}
        run: |
          if [ -n "$SLUG" ]; then
            slugs="$SLUG"
          else
            slugs=$(git diff --name-only "$ANTES" "$GITHUB_SHA" -- 'conteudo-social/*/imagens.json' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            # Mudança no gerador: refaz os vídeos com fotos escolhidas que ainda não foram ao YouTube.
            if git diff --name-only "$ANTES" "$GITHUB_SHA" | grep -q '^scripts/gerar-video.mjs$'; then
              slugs=$(for f in conteudo-social/*/imagens.json; do d=$(dirname "$f"); [ -f "$d/youtube.json" ] || basename "$d"; done | tr '\n' ' ')
            fi
          fi
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Vídeos: $slugs"
      - name: Gerar vídeos
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          VOZ: ${{ inputs.voz || vars.VOZ || (secrets.AZURE_SPEECH_KEY != '' && 'azure') || 'gratis' }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          VOZ_AZURE: ${{ vars.VOZ_AZURE }}
          VOZ_AZURE_TOM: ${{ vars.VOZ_AZURE_TOM }}
          VOZ_GRATIS: ${{ vars.VOZ_GRATIS }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SLUGS: ${{ steps.quais.outputs.slugs }}
        id: gerar
        run: |
          ok=""; falhou=""
          for s in $SLUGS; do
            if npm run video -- "$s"; then ok="$ok $s"; else falhou="$falhou $s"; echo "::error::Falha ao gerar $s"; fi
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "falhou=$falhou" >> "$GITHUB_OUTPUT"
      - name: Guardar narrações no cache (mesmo se algum vídeo falhou)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache-video/*/*.mp3
          key: narracao-${{ vars.ELEVENLABS_VOICE_ID }}-${{ hashFiles('conteudo-social/*/youtube.md') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Enviar ao YouTube (como privado)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SLUGS: ${{ steps.gerar.outputs.ok }}
        run: |
          [ -n "$(echo $SLUGS)" ] || exit 0
          node scripts/publicar-youtube.mjs $SLUGS
          node scripts/legendas-youtube.mjs $SLUGS || echo "::warning::Legendas não enviadas (veja acima)."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conteudo-social/*/youtube.json
          if git diff --cached --quiet; then echo "Nenhum envio novo."; exit 0; fi
          git commit -m "chore: vídeos enviados ao YouTube (privados)"
          git pull --rebase
          git push
      - name: Avisar vídeos que falharam
        if: steps.gerar.outputs.falhou != ''
        env:
          FALHOU: ${{ steps.gerar.outputs.falhou }}
        run: |
          echo "::error::Não foram gerados:$FALHOU (veja o passo Gerar vídeos)."
          exit 1
      - name: Anexar vídeos, narrações, legendas, miniaturas e créditos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: |
            video-out/*/video.mp4
            video-out/*/legendas.srt
            video-out/*/miniatura.png
            video-out/*/creditos.txt
            video-out/*/narracao.m4a
            video-out/*/metadados.json
          retention-days: 14
