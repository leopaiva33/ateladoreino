name: Narrar o Reel da série A Queda

# Narra o Reel 1 da série A Queda com uma voz da ElevenLabs (segredo ELEVENLABS_API_KEY) e
# grava public/social/queda-de-lucifer/reel-1-a-queda.mp4 e as narrações em
# art/reel-queda/narracao/ (reaproveitadas depois, sem gastar créditos de novo).
# Roda sozinho quando o script do Reel ou este workflow mudam, ou manualmente
# (Actions > Narrar o Reel da série A Queda), onde dá para trocar a voz.
# Voz padrão: Brian (masculina, grave, de narração), uma das vozes prontas da ElevenLabs.
# Outras masculinas: Adam (pNInz6obpgDQGcFmaJgB) e Daniel (onwK4e9ZLuTAKqWW03F9).
on:
  push:
    paths:
      - 'art/reel-queda/montar.mjs'
      - '.github/workflows/narrar-reel-queda.yml'
  workflow_dispatch:
    inputs:
      voz:
        description: 'ID da voz na ElevenLabs (padrão: Brian, masculina)'
        required: false
        default: 'nPczCjzI2devNBz1zQrb'
        type: string

permissions:
  contents: write

concurrency:
  group: narrar-reel-queda-${{ github.ref }}
  cancel-in-progress: false

jobs:
  narrar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: npm ci
      - name: Instalar Playwright (Chromium) para desenhar os textos
        run: |
          npm i -g playwright@1.63.0
          playwright install --with-deps chromium
      - name: Montar o Reel com narração
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOZ_ID: ${{ inputs.voz || 'nPczCjzI2devNBz1zQrb' }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then echo "::error::Segredo ELEVENLABS_API_KEY não configurado."; exit 1; fi
          node art/reel-queda/montar.mjs public/social/queda-de-lucifer/reel-1-a-queda.mp4
      - name: Gravar o vídeo e as narrações no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/social/queda-de-lucifer/reel-1-a-queda.mp4 art/reel-queda/narracao
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "chore: Reel 1 da série A Queda com narração"
          git pull --rebase
          git push
      - name: Anexar o vídeo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-1-a-queda
          path: public/social/queda-de-lucifer/reel-1-a-queda.mp4
          retention-days: 14
