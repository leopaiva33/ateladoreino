name: Publicar carrossel no Instagram

# Disparo manual (Actions > Publicar carrossel no Instagram > Run workflow).
# Exige os segredos IG_USER_ID e IG_ACCESS_TOKEN do repositório e que os slides
# já estejam no ar em https://ateladoreino.com/social/<slug>/.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug do artigo (ex.: salmo-23-significado)'
        required: true
        type: string
      publicar:
        description: 'Marque para publicar de verdade; desmarcado, só simula'
        required: false
        default: false
        type: boolean
      reel:
        description: 'Marque para o Reel (vídeo vertical) em vez do carrossel'
        required: false
        default: false
        type: boolean

jobs:
  instagram:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Simular ou publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SLUG: ${{ inputs.slug }}
          PUBLICAR: ${{ inputs.publicar }}
          REEL: ${{ inputs.reel }}
        run: |
          args=("$SLUG")
          [ "$REEL" = "true" ] && args+=(--reel)
          [ "$PUBLICAR" = "true" ] && args+=(--publicar)
          node scripts/publicar-instagram.mjs "${args[@]}"
      - name: Registrar publicação
        if: inputs.publicar
        env:
          SLUG: ${{ inputs.slug }}
          REEL: ${{ inputs.reel }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$REEL" = "true" ]; then arq=reel.json; tipo=Reel; else arq=instagram.json; tipo=carrossel; fi
          git add "conteudo-social/$SLUG/$arq"
          git commit -m "chore: $tipo de $SLUG publicado no Instagram"
          git pull --rebase
          git push
