name: Buscar fotos dos carrosséis

# Busca no Pixabay (ou Pexels) fotos candidatas para os slides dos carrosséis (campo "busca" de cada
# slide do carrossel.json) e grava conteudo-social/<slug>/fotos-carrossel.json no mesmo branch.
# Roda sozinho quando um carrossel.json muda, ou manualmente (Actions > Buscar fotos dos carrosséis).
# Requer o segredo PIXABAY_API_KEY (chave grátis em https://pixabay.com/api/docs/) ou PEXELS_API_KEY.
on:
  push:
    paths:
      - 'conteudo-social/*/carrossel.json'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug do artigo (vazio = todos os carrosséis)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: buscar-fotos-carrossel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar fotos
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SLUG: ${{ inputs.slug }}
        run: node scripts/buscar-fotos-carrossel.mjs $SLUG
      - name: Gravar fotos-carrossel.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conteudo-social/*/fotos-carrossel.json
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "chore: fotos candidatas para os carrosséis"
          git pull --rebase
          git push
