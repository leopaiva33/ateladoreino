<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b0f18"/>
      <stop offset="1" stop-color="#5c1a26"/>
    </linearGradient>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150c1c"/>
      <stop offset="1" stop-color="#2e2f5e"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f6c97a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#f6c97a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mesa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a1f2b"/>
      <stop offset="1" stop-color="#3b0f18"/>
    </linearGradient>
    <clipPath id="janela"><path d="M440 410 V200 A160 160 0 0 1 760 200 V410 Z"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#parede)"/>
  <!-- janela em arco: noite de lua cheia -->
  <path d="M440 410 V200 A160 160 0 0 1 760 200 V410 Z" fill="url(#ceu)"/>
  <g clip-path="url(#janela)">
    <circle cx="600" cy="250" r="140" fill="url(#halo)"/>
    <circle cx="600" cy="250" r="52" fill="#f9e4b0"/>
    <g fill="#fff7e8" opacity=".7"><circle cx="490" cy="170" r="2"/><circle cx="700" cy="150" r="1.6"/><circle cx="720" cy="300" r="1.6"/></g>
    <path d="M440 400 Q520 350 600 372 T760 360 V410 H440 Z" fill="#3b0f18"/>
  </g>
  <path d="M430 420 V200 A170 170 0 0 1 770 200 V420" fill="none" stroke="#7a1f2b" stroke-width="16"/>
  <!-- mesa -->
  <rect x="0" y="440" width="1200" height="190" fill="url(#mesa)"/>
  <rect x="0" y="434" width="1200" height="12" fill="#97323f"/>
  <!-- luz sobre a mesa -->
  <circle cx="600" cy="480" r="200" fill="url(#halo)" opacity=".7"/>
  <!-- pão achatado -->
  <ellipse cx="500" cy="500" rx="120" ry="26" fill="#e6d4b8"/>
  <ellipse cx="500" cy="494" rx="112" ry="20" fill="#f3e6d3"/>
  <g fill="#d9c3a0"><circle cx="460" cy="492" r="3"/><circle cx="500" cy="488" r="3"/><circle cx="540" cy="494" r="3"/><circle cx="480" cy="500" r="3"/><circle cx="525" cy="502" r="3"/></g>
  <!-- cálice -->
  <path d="M690 400 H780 C780 450 750 470 735 472 C720 470 690 450 690 400 Z" fill="#e9b45f"/>
  <path d="M696 408 H774 C772 430 760 446 735 452 C710 446 698 430 696 408 Z" fill="#97323f"/>
  <rect x="729" y="470" width="12" height="36" fill="#e9b45f"/>
  <ellipse cx="735" cy="510" rx="36" ry="8" fill="#e9b45f"/>
</svg>
