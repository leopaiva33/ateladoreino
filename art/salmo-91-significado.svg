      <ellipse cx="0" cy="0" rx="116" ry="21" transform="translate(-79.9 -68.2) rotate(37)" fill="#fbf1dc" stroke="#d9c3a0" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="100" ry="21" transform="translate(-66.9 -82.3) rotate(48)" fill="#f3e6d3" stroke="#d9c3a0" stroke-width="3"/>
