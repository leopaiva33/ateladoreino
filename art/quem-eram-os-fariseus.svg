<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe6cb"/>
      <stop offset="1" stop-color="#f1cfae"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f6c97a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f6c97a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#97323f"/>
      <stop offset="1" stop-color="#3b0f18"/>
    </linearGradient>
  </defs>
  <!-- céu claro do fim de tarde -->
  <rect width="1200" height="630" fill="url(#ceu)"/>
  <!-- muro do pátio -->
  <rect x="0" y="150" width="1200" height="300" fill="#7a1f2b"/>
  <rect x="0" y="140" width="1200" height="18" fill="#5c1a26"/>
  <!-- portão iluminado -->
  <path d="M520 450 V250 A80 80 0 0 1 680 250 V450 Z" fill="#f9dc9b"/>
  <circle cx="600" cy="320" r="170" fill="url(#halo)"/>
  <path d="M548 450 V262 A52 52 0 0 1 652 262 V450 Z" fill="#fff4de"/>
  <!-- colunas -->
  <g fill="#e6d4b8">
    <rect x="250" y="170" width="44" height="280"/><rect x="380" y="170" width="44" height="280"/>
    <rect x="776" y="170" width="44" height="280"/><rect x="906" y="170" width="44" height="280"/>
  </g>
  <g fill="#f3e6d3">
    <rect x="240" y="160" width="64" height="16"/><rect x="370" y="160" width="64" height="16"/>
    <rect x="766" y="160" width="64" height="16"/><rect x="896" y="160" width="64" height="16"/>
  </g>
  <!-- chão e escada -->
  <rect x="0" y="450" width="1200" height="180" fill="url(#chao)"/>
  <g fill="#d9c3a0">
    <rect x="470" y="450" width="260" height="16"/>
    <rect x="440" y="466" width="320" height="16" opacity=".85"/>
    <rect x="410" y="482" width="380" height="16" opacity=".7"/>
  </g>
  <!-- bancos de pedra -->
  <g fill="#d9c3a0" opacity=".55">
    <rect x="200" y="520" width="200" height="22" rx="4"/><rect x="220" y="542" width="16" height="30"/><rect x="364" y="542" width="16" height="30"/>
    <rect x="800" y="520" width="200" height="22" rx="4"/><rect x="820" y="542" width="16" height="30"/><rect x="964" y="542" width="16" height="30"/>
  </g>
</svg>
