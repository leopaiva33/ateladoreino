  <g fill="#f3e6d3">
    <rect x="470" y="560" width="26" height="40" rx="10"/>
    <rect x="726" y="520" width="22" height="34" rx="9"/>
    <rect x="560" y="470" width="18" height="28" rx="7"/>
    <rect x="680" y="420" width="15" height="23" rx="6"/>
    <rect x="590" y="372" width="12" height="18" rx="5"/>
