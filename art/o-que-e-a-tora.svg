  <path d="M0 340 Q300 300 600 330 T1200 320 V630 H0 Z" fill="#7a1f2b"/>
  <path d="M0 430 Q320 390 640 420 T1200 410 V630 H0 Z" fill="#5c1a26"/>
  <path d="M0 520 Q300 490 640 510 T1200 500 V630 H0 Z" fill="#3b0f18"/>
