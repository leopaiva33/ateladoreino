<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- A leitura dupla: no pilar de ouro, o reflexo do rei sugere asas -->
  <defs>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e4416"/><stop offset=".2" stop-color="#a47a2c"/><stop offset=".5" stop-color="#f0cd7a"/>
      <stop offset=".8" stop-color="#a47a2c"/><stop offset="1" stop-color="#5e4416"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe2a0" stop-opacity=".35"/><stop offset="1" stop-color="#ffe2a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".45" stop-color="#0b0710" stop-opacity="0"/><stop offset=".72" stop-color="#0b0710" stop-opacity=".75"/><stop offset="1" stop-color="#0b0710" stop-opacity=".95"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="#120b16"/>
  <circle cx="540" cy="620" r="620" fill="url(#halo)"/>
  <!-- pilar -->
  <rect x="300" y="0" width="480" height="1920" fill="url(#ouro)"/>
  <g stroke="#6b4e1a" stroke-width="4" opacity=".45">
    <path d="M360 0 V1920 M420 0 V1920 M660 0 V1920 M720 0 V1920"/>
  </g>
  <rect x="280" y="140" width="520" height="40" fill="#8a6624"/>
  <!-- reflexo: asas apenas sugeridas, atrás do rei -->
  <g fill="#fff3d0" opacity=".22">
    <path d="M540 520 Q 420 420 320 470 Q 390 500 400 560 Q 450 540 500 580 Z"/>
    <path d="M540 520 Q 660 420 760 470 Q 690 500 680 560 Q 630 540 580 580 Z"/>
  </g>
  <g fill="#3b2a0c" opacity=".7">
    <path d="M492 500 l14 -44 l16 30 l18 -40 l18 40 l16 -30 l14 44 z"/>
    <circle cx="540" cy="550" r="52"/>
    <path d="M470 610 Q 540 580 610 610 L 650 900 L 430 900 Z"/>
  </g>
  <rect width="1080" height="1920" fill="url(#base)"/>
</svg>
