<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1630"/>
      <stop offset=".7" stop-color="#2b2850"/>
      <stop offset="1" stop-color="#4a3350"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c55"/>
      <stop offset="1" stop-color="#14183a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f9e4b0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f9e4b0" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="1200" height="630" fill="#fff"/>
      <circle cx="890" cy="148" r="62" fill="#000"/>
    </mask>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="850" cy="165" r="230" fill="url(#glow)"/>
  <circle cx="850" cy="165" r="72" fill="#fbf1dc" mask="url(#crescent)"/>
  <g fill="#fbf1dc">
    <circle cx="120" cy="80" r="2.5" opacity=".9"/><circle cx="260" cy="150" r="2" opacity=".7"/>
    <circle cx="390" cy="70" r="2.5" opacity=".8"/><circle cx="520" cy="190" r="2" opacity=".6"/>
    <circle cx="610" cy="90" r="3" opacity=".9"/><circle cx="700" cy="230" r="2" opacity=".6"/>
    <circle cx="1060" cy="90" r="2.5" opacity=".8"/><circle cx="1120" cy="210" r="2" opacity=".6"/>
    <circle cx="190" cy="260" r="2" opacity=".6"/><circle cx="330" cy="300" r="2.5" opacity=".7"/>
    <circle cx="990" cy="290" r="2" opacity=".6"/><circle cx="450" cy="110" r="1.8" opacity=".7"/>
  </g>
  <!-- colinas -->
  <path d="M0 400 Q180 340 380 392 T760 380 T1200 396 V630 H0 Z" fill="#1c1d45"/>
