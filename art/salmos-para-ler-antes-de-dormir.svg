  <g fill="#fbf1dc" opacity=".35">
    <rect x="800" y="470" width="100" height="5" rx="2.5"/><rect x="815" y="490" width="70" height="5" rx="2.5"/>
    <rect x="828" y="512" width="44" height="5" rx="2.5"/><rect x="838" y="536" width="24" height="5" rx="2.5"/>
  </g>
  <path d="M0 560 Q150 545 300 560 T600 560 T900 560 T1200 560 V630 H0 Z" fill="#0f1230"/>
