  <g>
    <path d="M330 470 H690 V530 H330 Z" fill="#f3e6d3"/>
    <rect x="300" y="458" width="36" height="84" rx="18" fill="#d9c3a0"/>
    <rect x="684" y="458" width="36" height="84" rx="18" fill="#d9c3a0"/>
    <rect x="312" y="446" width="12" height="108" rx="6" fill="#7a1f2b"/>
    <rect x="696" y="446" width="12" height="108" rx="6" fill="#7a1f2b"/>
