  <path d="M440 400 V180 A160 160 0 0 1 760 180 V400 Z" fill="url(#ceu)"/>
  <circle cx="600" cy="320" r="150" fill="url(#halo)" clip-path="url(#janela)"/>
  <circle cx="600" cy="330" r="40" fill="#f6d28f"/>
  <path d="M440 400 Q520 350 600 372 T760 360 V400 Z" fill="#5c1a26"/>
  <g fill="#fff7e8" opacity=".7"><circle cx="520" cy="140" r="2"/><circle cx="672" cy="118" r="1.6"/><circle cx="700" cy="200" r="1.6"/></g>
  <path d="M430 410 V180 A170 170 0 0 1 770 180 V410" fill="none" stroke="#7a1f2b" stroke-width="16"/>
  <!-- mesa -->
  <rect x="0" y="430" width="1200" height="200" fill="url(#mesa)"/>
  <rect x="0" y="426" width="1200" height="10" fill="#97323f"/>
