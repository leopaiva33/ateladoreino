<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150c1c"/>
      <stop offset=".6" stop-color="#2e2f5e"/>
      <stop offset="1" stop-color="#3b3a6e"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f6c97a" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#f6d28f" stop-opacity=".3"/>
      <stop offset="1" stop-color="#f6c97a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pedra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6d4b8"/>
      <stop offset="1" stop-color="#d9c3a0"/>
    </linearGradient>
    <linearGradient id="piso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c1a26"/>
      <stop offset="1" stop-color="#3b0f18"/>
    </linearGradient>
  </defs>
  <!-- céu de inverno -->
  <rect width="1200" height="630" fill="url(#ceu)"/>
  <g fill="#fff7e8" opacity=".75">
    <circle cx="70" cy="70" r="2"/><circle cx="160" cy="150" r="1.5"/><circle cx="1080" cy="90" r="2"/>
    <circle cx="1140" cy="190" r="1.6"/><circle cx="990" cy="40" r="1.4"/><circle cx="210" cy="40" r="1.5"/>
    <circle cx="60" cy="250" r="1.4"/><circle cx="1150" cy="300" r="1.4"/>
  </g>
  <!-- colinas ao fundo -->
  <path d="M0 430 Q300 380 600 400 Q900 420 1200 370 V630 H0 Z" fill="#2a1d36"/>
  <!-- pórtico: telhado e colunas -->
  <g fill="url(#pedra)">
    <rect x="230" y="150" width="740" height="34" rx="4"/>
    <rect x="215" y="184" width="770" height="14" rx="3"/>
    <rect x="230" y="470" width="740" height="18" rx="3"/>
  </g>
  <g fill="#f3e6d3" opacity=".95">
    <rect x="262" y="198" width="34" height="272"/>
    <rect x="382" y="198" width="34" height="272"/>
    <rect x="784" y="198" width="34" height="272"/>
    <rect x="904" y="198" width="34" height="272"/>
  </g>
  <g fill="#d9c3a0">
    <rect x="254" y="198" width="50" height="10"/><rect x="374" y="198" width="50" height="10"/>
    <rect x="776" y="198" width="50" height="10"/><rect x="896" y="198" width="50" height="10"/>
    <rect x="254" y="460" width="50" height="10"/><rect x="374" y="460" width="50" height="10"/>
    <rect x="776" y="460" width="50" height="10"/><rect x="896" y="460" width="50" height="10"/>
  </g>
  <!-- halo da lâmpada -->
  <circle cx="600" cy="370" r="230" fill="url(#halo)"/>
  <!-- pedestal -->
  <rect x="560" y="400" width="80" height="70" rx="4" fill="#97323f"/>
  <rect x="548" y="392" width="104" height="14" rx="4" fill="#7a1f2b"/>
  <!-- lâmpada a óleo -->
  <path d="M548 392 C548 360 652 360 652 392 Z" fill="#e9b45f"/>
  <path d="M640 372 C664 366 676 372 680 380 L652 388 Z" fill="#e9b45f"/>
  <ellipse cx="600" cy="370" rx="16" ry="6" fill="#7a1f2b"/>
  <path d="M676 376 C690 352 684 334 672 320 C672 340 660 352 664 370 Z" fill="#f9e4b0"/>
  <path d="M674 372 C681 358 679 348 673 340 C671 352 666 360 668 372 Z" fill="#fffaf0"/>
  <!-- piso -->
  <path d="M0 488 H1200 V630 H0 Z" fill="url(#piso)"/>
  <path d="M0 540 Q600 520 1200 545 V630 H0 Z" fill="#3b0f18" opacity=".7"/>
